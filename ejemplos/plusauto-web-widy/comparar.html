<body data-page="comparar">
<div id="siteHeader"></div>

<main id="main" class="page">
  <div class="wrap">
    <div class="page__head">
      <nav class="crumbs" aria-label="Migas de pan"><a href="/ejemplos/plusauto-web-widy/">Inicio</a><span data-icon="chevR"></span><span>Comparador</span></nav>
      <h1>Compara hasta 3 vehículos</h1>
      <p class="muted" style="max-width:60ch">Lado a lado, con lo mejor de cada fila marcado. Añade vehículos desde el catálogo con el icono de la balanza, o elígelos aquí.</p>
    </div>
    <div class="cmp__add" id="cmpAdd">
      <div class="field-inline">
        <div class="select" style="flex:1;max-width:520px;display:flex"><select id="cmpSel" aria-label="Añadir vehículo al comparador" style="width:100%"><option value="">Añadir un vehículo…</option></select><span data-icon="chevD"></span></div>

        <button class="btn btn--ghost btn--sm" id="cmpClear" type="button"><span data-icon="trash"></span>Vaciar</button>
      </div>
      <div class="cmp__pick" id="cmpPick"></div>
    </div>
    <div id="cmpArea" style="margin-top:22px"></div>
    <p class="note" style="margin-top:16px">* Cuotas orientativas sin entrada (coches a 96 meses, motos a 60), TIN 7,99 %, sujetas a aprobación.</p>
